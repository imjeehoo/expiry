<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Expiry">
  <title>Expiry</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Expiry</h1>
    <button id="export" class="pill" type="button" disabled>Export</button>
  </header>

  <main>
    <form id="form" autocomplete="off" novalidate>
      <section class="card">
        <label class="field">
          <span class="label">Name</span>
          <input id="name" type="text" list="names" placeholder="Item name"
                 autocapitalize="sentences" autocorrect="off" spellcheck="false" enterkeyhint="next">
        </label>
        <div class="field">
          <label class="label" for="weight">Weight</label>
          <div class="weight-row">
            <input id="weight" type="text" inputmode="decimal" placeholder="0" enterkeyhint="next">
            <div id="units" class="seg" role="radiogroup" aria-label="Unit"></div>
          </div>
        </div>
      </section>

      <section class="card">
        <div id="years" class="chips" role="radiogroup" aria-label="Year"></div>
        <div class="lot">
          <div class="field">
            <button id="order" class="label link" type="button" title="Switch day/month order">Expiry · MM.DD</button>
            <input id="date" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="MM.DD"
                   enterkeyhint="next" aria-label="Expiry date">
          </div>
          <label class="field qty">
            <span class="label">Amount</span>
            <input id="amount" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="1" enterkeyhint="done">
          </label>
          <button id="add" class="add" type="submit" aria-label="Add">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          </button>
        </div>
        <p id="preview" class="preview">&nbsp;</p>
      </section>
    </form>

    <div class="list-head">
      <span id="count">No entries</span>
      <button id="clear" class="link" type="button" hidden>Clear all</button>
    </div>
    <section id="list"></section>
  </main>

  <div id="bar" class="bar" hidden>
    <button id="newItem" class="ghost" type="button">New item</button>
    <button id="primary" class="primary" type="button">Next</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button id="toastAction" class="link" type="button" hidden>Undo</button>
  </div>

  <datalist id="names"></datalist>

  <script src="xlsx.js"></script>
  <script src="app.js"></script>
</body>
</html>
